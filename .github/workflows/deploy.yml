name: Deploy cmlk.ch

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wp-update]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch WordPress content
        # Le WP est joint par IP + Host (domaine basculé vers Pages). Non-bloquant :
        # si le WP est injoignable, le build continue avec les données du dépôt.
        run: npm run fetch:wp || echo "⚠️ WordPress injoignable — build avec les données commitées"
        env:
          WP_BASE: https://109.234.162.70
          WP_HOST: cmlk.ch

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_GA4_ID: ${{ secrets.GA4_ID }}

      - name: SEO contract (bloquant)
        run: |
          python3 scripts/seo_contract.py data/audit_cmlk.json dist --posts data/wp/posts.json

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name cmlk --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
